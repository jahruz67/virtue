<title>Windows · Preview</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22128%22%20height%3D%22128%22%20viewBox%3D%220%200%20128%20128%22%3E%0D%0A%20%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%22120%22%20height%3D%22120%22%20rx%3D%2228%22%20fill%3D%22%23245edb%22%2F%3E%0D%0A%20%3Crect%20x%3D%2225%22%20y%3D%2236%22%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%228%22%20fill%3D%22%23a6c5ff%22%2F%3E%0D%0A%20%3Crect%20x%3D%2239%22%20y%3D%2224%22%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%228%22%20fill%3D%22%23ffffff%22%2F%3E%0D%0A%20%3Cpath%20d%3D%22M39%2041h64%22%20stroke%3D%22%23c8dafb%22%20stroke-width%3D%222%22%2F%3E%0D%0A%20%3Cg%20fill%3D%22%23245edb%22%3E%0D%0A%20%20%3Ccircle%20cx%3D%2249%22%20cy%3D%2232%22%20r%3D%222%22%2F%3E%3Ccircle%20cx%3D%2257%22%20cy%3D%2232%22%20r%3D%222%22%2F%3E%0D%0A%20%20%3Crect%20x%3D%2255%22%20y%3D%2252%22%20width%3D%2212%22%20height%3D%2212%22%20rx%3D%221%22%2F%3E%3Crect%20x%3D%2271%22%20y%3D%2252%22%20width%3D%2212%22%20height%3D%2212%22%20rx%3D%221%22%2F%3E%0D%0A%20%20%3Crect%20x%3D%2255%22%20y%3D%2268%22%20width%3D%2212%22%20height%3D%2212%22%20rx%3D%221%22%2F%3E%3Crect%20x%3D%2271%22%20y%3D%2268%22%20width%3D%2212%22%20height%3D%2212%22%20rx%3D%221%22%2F%3E%0D%0A%20%3C%2Fg%3E%0D%0A%3C%2Fsvg%3E">
<style>
:root{color-scheme:light;--bg:#f5f6f8;--card:#fff;--line:#dce1e8;--text:#202631;--muted:#5c6676;--blue:#245edb;--mint:#14724d;--amber:#965a10}
*{box-sizing:border-box}
body{margin:0;background:#e9edf2;color:var(--text);font:14px 'Segoe UI','Noto Sans',sans-serif}
button,input,select,textarea{font:inherit}
button,select{cursor:pointer}
button{background:#fff;border:1px solid #b8c2cf;color:var(--text);padding:8px 13px;border-radius:6px;font-weight:600;white-space:nowrap}
button:hover{background:#f0f3f8;border-color:#8d9bad}
button:active{background:#e5ebf4}
button:disabled{background:#f0f2f5;color:#8b95a4;border-color:var(--line);cursor:default}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button.primary:hover{background:#1d4fc0;border-color:#1d4fc0}
button.primary:disabled{background:#e4eaf6;color:#8999bb;border-color:#d5def0}
button.danger{color:#b42332;border-color:#d98b94}
button.danger:hover{background:#fff0f1}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
input,select,textarea{background:#fff;border:1px solid #b8c2cf;border-radius:6px;padding:8px;color:var(--text);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
input:disabled,select:disabled{background:#eef0f4;color:#7a8697}
input::placeholder{color:#677387}
input[type=checkbox]{accent-color:var(--blue);width:17px;height:17px}
p{line-height:1.6;margin:0 0 15px}
h1,h2,h3{margin:0}
h2{font-size:20px;font-weight:600}
h3{font-size:17px;margin:20px 0 10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.mint{color:var(--mint)}
.amber{color:var(--amber)}
.preview-bar{max-width:1060px;margin:auto;padding:24px 0 20px;display:flex;align-items:center;justify-content:flex-end;gap:16px}
.preview-control{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:11px;min-width:0}
.preview-control select{font-size:12px;max-width:265px}
.shell{width:calc(100% - 40px);max-width:1060px;min-width:min(420px,calc(100vw - 20px));height:min(644px,calc(100dvh - 120px));min-height:320px;margin:0 auto 24px;border:1px solid #c6ced9;border-radius:10px;overflow:hidden;resize:both;display:flex;flex-direction:column;container:app / inline-size;box-shadow:0 18px 56px #26364c16}
.titlebar{display:flex;flex-shrink:0;justify-content:space-between;align-items:center;background:#f8f9fb;padding:9px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.window-tools{display:flex;align-items:center;gap:7px}
.window-tools button{padding:0;width:26px;height:24px;border:0;background:transparent;font-weight:400}
.app{background:var(--bg);min-height:0;flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;flex-shrink:0;align-items:center;gap:10px;padding:16px 24px;background:#fff;border-bottom:1px solid var(--line)}
.spacer{flex:1}
[hidden]{display:none!important}
.status:empty{display:none}
.icon-button{display:grid;place-items:center;min-width:36px;height:36px;padding:6px}
.action-icon{width:18px;height:18px;display:inline-block;vertical-align:middle;flex-shrink:0;pointer-events:none}
.window-caption{display:flex;align-items:center;gap:8px}
.window-caption .action-icon{width:16px;height:16px}
.window-tools .action-icon{width:13px;height:13px}
.dialog-title button .action-icon{width:16px;height:16px}
.actions{min-width:88px}
.banner{background:#edf8f1;border:1px solid #cde5d6;color:#23613f;border-radius:8px;padding:12px 16px;display:flex;flex-shrink:0;gap:16px;align-items:center;line-height:1.5;margin:24px 28px 0;overflow-wrap:anywhere}
.banner>span{flex:1}
.banner.warning{background:#fff6e7;border-color:#e9c98a;color:#805013}
.cards{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding:24px 28px;scrollbar-gutter:stable}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 20px;display:flex;flex-shrink:0;align-items:center;gap:20px}
.tile{flex-shrink:0;width:144px;height:90px;border-radius:8px;overflow:hidden}
.tile svg,.empty-artwork svg{display:block;width:144px;height:90px}
.vm-content{flex:1;min-width:0;overflow-wrap:anywhere}
.vm-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:7px}
.vm-title{font-size:20px;font-weight:600;overflow-wrap:anywhere}
.state{color:#526071;background:#edf0f4;border-radius:10px;padding:4px 9px;white-space:nowrap;font-weight:400;font-size:12px}
.state.mint{color:#14724d;background:#edf8f1}
.vm-content>.muted{margin-top:7px;line-height:1.5}
.actions{display:flex;flex-direction:column;gap:8px;align-self:center}
.actions>button{width:100%}
.empty{padding:48px 30px;text-align:center;display:block}
.empty-artwork{display:flex;justify-content:center;margin-bottom:22px}
.empty h2{margin-bottom:14px}
.empty p:last-child{margin-bottom:0}
.status{background:var(--bg);border-top:1px solid #e3e7ed;padding:8px 14px;color:var(--muted);font-size:12px;min-height:32px;flex-shrink:0;max-height:80px;overflow:auto;overflow-wrap:anywhere}
.progress{height:6px;background:#e5ebf4;border-radius:3px;overflow:hidden;margin:8px 0}
.progress div{height:100%;background:var(--blue);border-radius:3px}
.progress.attention div{background:#b57318}
.setup{margin-top:14px}
.setup p{margin:6px 0 0;line-height:1.5}
.setup-buttons{display:flex;gap:8px;margin-top:10px}
.setup-buttons button{font-size:12px;padding:6px 10px}
.popup{position:fixed;inset:auto;margin:0;z-index:1000;background:#fff;border:1px solid #c6ced9;padding:6px;border-radius:7px;box-shadow:0 10px 28px #25354c26;min-width:min(260px,calc(100vw - 16px));max-width:calc(100vw - 16px);max-height:calc(100dvh - 16px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable}
.popup[hidden]{display:none}
.popup button{display:block;background:transparent;border:0;border-radius:4px;text-align:left;width:100%;padding:8px 22px;font-weight:400;white-space:normal;overflow-wrap:anywhere}
.popup button:hover:not(:disabled){background:#e8efff;color:#1949b2}
.popup button:disabled{color:#8b95a4}
.popup hr{border:0;border-top:1px solid #e3e7ed;margin:6px 12px}
dialog{padding:0;border:1px solid #c6ced9;border-radius:10px;background:var(--bg);color:var(--text);width:660px;max-width:calc(100vw - 24px);max-height:calc(100vh - 40px);box-shadow:0 25px 80px #172b4a33}
dialog::backdrop{background:#1c2b4352}
dialog.wide{width:780px}
.dialog-title{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#f8f9fb;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.dialog-title button{border:0;padding:0 5px;background:transparent;font-size:20px;font-weight:400}
.dialog-body{padding:24px;overflow:auto;max-height:calc(100vh - 150px)}
.dialog-body>h2{margin-bottom:12px}
.dialog-footer{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:0 24px 24px}
.tabs{display:flex;overflow-x:auto;margin-top:20px}
.tabs button{border-radius:6px 6px 0 0;border:0;border-bottom:2px solid transparent;background:#edf0f4;color:var(--muted);padding:11px 18px;font-weight:400}
.tabs button[aria-selected=true]{color:#1949b2;background:#fff;border-bottom-color:var(--blue)}
.tab-panel{background:#fff;border:1px solid var(--line);border-radius:0 8px 8px;padding:20px;min-height:285px}
.tab-panel[hidden]{display:none}
.form-row{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin-bottom:14px}
.form-row>label{line-height:1.5}
.file-field{display:flex;gap:8px;align-items:center}
.file-field input{width:100%}
.form-note{color:var(--muted);line-height:1.6}
.advanced-resources>summary{cursor:pointer;width:fit-content;padding:8px 13px;background:#fff;border:1px solid #b8c2cf;border-radius:6px;font-weight:600}
.advanced-fields{padding-top:20px}
.check{display:flex;gap:9px;align-items:center;margin:16px 0}
.dialog-body .form-note:last-child{margin-bottom:0}
.error{color:#b42332;margin:16px 0 0}
.text-panel{background:#fff;border:1px solid #b8c2cf;border-radius:6px;padding:18px;min-height:310px;overflow-wrap:anywhere;line-height:1.65}
.text-panel h2{margin:0 0 12px}
.text-panel p:last-child{margin-bottom:0}
pre{margin:0;white-space:pre-wrap;font:13px/1.75 Consolas,monospace;color:#3c4a5f}
.dialog-field{display:flex;flex-direction:column;gap:10px}
.dialog-field input,.dialog-field select{width:100%}
.file-list{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;margin:14px 0 18px}
.file-list div{padding:9px 12px;border-radius:4px}
.file-list .selected{background:#e8efff;color:#1949b2}
.file-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
.notice{color:var(--muted);font-size:12px;line-height:1.5;margin:12px 0 0}
.checkline{margin:14px 0}
.checkline b{display:block}
.busy-bar{height:5px;background:#e5ebf4;margin-top:12px}
.busy-bar:after{content:'';display:block;width:40%;height:5px;background:var(--blue)}
.guest-display{flex:1;min-height:0;background:#11151b;overflow:hidden}
.guest-display svg{display:block;width:100%;height:100%}
.vm-menubar{display:flex;gap:4px;padding:2px 6px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
.vm-menubar button{border:0;background:transparent;font-weight:400;padding:6px 12px}
.vm-menubar button:hover{background:#e8efff;color:#1949b2}
@media(max-width:1100px){.preview-bar{margin-left:20px;margin-right:20px}.shell{margin-left:20px;margin-right:20px}}
@container app (max-width:620px){.card:not(.empty){flex-direction:column;align-items:stretch;padding:16px;gap:14px}.tile{display:none}.vm-content{flex:auto;width:100%}.actions{flex-direction:row;align-self:stretch;min-width:0}.actions>button{width:auto;flex:1;min-width:0}.actions>.icon-button{flex:0 0 36px}}
@media(max-width:760px){.preview-bar{flex-wrap:wrap;gap:12px}.preview-control{flex:1 1 160px}.preview-control select{width:100%}.form-row{grid-template-columns:1fr;gap:6px}.tabs button{padding:10px;font-size:12px}.tab-panel{padding:16px}.titlebar{font-size:11px}.dialog-body{padding:18px}.shell{width:calc(100% - 20px);margin-left:10px;margin-right:10px}}
@media print{.preview-bar,.window-tools{display:none}.shell{height:auto;min-width:0;margin:0;max-width:none;resize:none;box-shadow:none;container-type:normal}.app{min-height:700px;overflow:visible}.cards{overflow:visible}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true"><defs>
<symbol id="icon-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4m-4 0h8"/></symbol>

<symbol id="icon-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.2 8.5C9.5 5.8 15.5 6 15 9.5 14.8 11.5 12 11.5 12 14"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/></symbol>
<symbol id="icon-more" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></g></symbol>

<symbol id="icon-maximize" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></symbol>

 <rect x="25" y="36" width="64" height="64" rx="8" fill="#a6c5ff"/>

 </g></g></symbol>

<div class="preview-bar" aria-label="Preview controls">
  <label class="preview-control">State<select id="workspace-state">
    <option value="ready">Ready</option><option value="empty">Empty library</option><option value="running">Running</option><option value="starting">Starting</option><option value="shutdown">Shutting down</option><option value="paused">Paused</option><option value="install0">Setup · Installing Windows</option><option value="install1">Setup · Integration drivers</option><option value="install2">Setup · Yttrium and Vulkan</option><option value="complete">Setup complete</option><option value="stopped">Setup stopped</option><option value="setupPaused">Setup paused</option><option value="failed">Setup needs attention</option><option value="safe">Compatible display · safe launch</option><option value="legacy">Windows 10 · compatible display</option><option value="host">Host needs attention</option><option value="checking">Checking host</option><option value="busy">Operation in progress</option>

    <optgroup label="Display"><option value="vm-window">VM window</option><option value="vm-controls">VM window · Controls</option><option value="display-help">Display shortcuts</option></optgroup>
    <optgroup label="Create & settings"><option value="create">New · General</option><option value="create-resources">New · Resources</option><option value="create-features">New · Features</option><option value="create-error">New · Error</option><option value="settings">Settings · General</option><option value="settings-resources">Settings · Resources</option><option value="settings-features">Settings · Features</option><option value="media">Choose installation media</option></optgroup>
    <optgroup label="Menus"><option value="manage">Actions</option><option value="help">Help</option></optgroup>
    <optgroup label="Information"><option value="diagnostics">Diagnostics</option><option value="guide">Setup</option><option value="details">Setup details</option><option value="log">Windows CAD · runtime log</option><option value="credentials">Sign-in</option><option value="verification">Guest graphics verification</option><option value="folder">Open Windows folder</option><option value="support">Open setup guides</option></optgroup>
    <optgroup label="Recovery & backup"><option value="checkpoint">New checkpoint</option><option value="restore">Restore checkpoint</option><option value="restore-confirm">Replace Windows with checkpoint?</option><option value="no-checkpoints">No recovery checkpoints</option><option value="expand">Expand disk</option><option value="export">Export backup</option><option value="exported">Backup exported</option><option value="import">Import backup</option><option value="gpu-report">Import guest GPU report</option></optgroup>
    <optgroup label="Confirmations & messages"><option value="restart">Restart?</option><option value="force">Force stop?</option><option value="remove">Remove</option><option value="name-mismatch">Name does not match</option><option value="error">Unable to complete action</option><option value="in-progress">Operation in progress</option><option value="leave">Leave Running?</option><option value="unavailable">Support files unavailable</option></optgroup>
  </select></label>
</div>
<main class="shell" id="library-window">
  <div class="titlebar"><span class="window-caption"><svg class="action-icon" viewBox="0 0 128 128" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-app"/></svg>Windows</span><div class="window-tools"><span aria-hidden="true"><svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-minimize"/></svg></span><span aria-hidden="true"><svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-maximize"/></svg></span><button data-screen="leave" aria-label="Preview close confirmation"><svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-close"/></svg></button></div></div>
  <div class="app">
    <header class="header"><button class="icon-button" id="diagnostics-button" data-screen="diagnostics" title="Host diagnostics" aria-label="Host diagnostics"><svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-monitor"/></svg></button><div class="spacer"></div><button class="icon-button" id="import-button" data-screen="import" title="Import Windows backup" aria-label="Import Windows backup"><svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-import"/></svg></button><button class="icon-button" id="create-button" data-screen="create" title="Create Windows" aria-label="Create Windows"><svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-add"/></svg></button><button class="icon-button" id="help-button" aria-haspopup="menu" aria-expanded="false" title="Help" aria-label="Help"><svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-help"/></svg></button></header>
    <div class="banner" id="banner"></div>
    <section class="cards" id="cards" aria-label="Windows environments"></section>
  </div>
  <div class="status" id="status" role="status"></div>
</main>
<section class="shell" id="vm-window" aria-label="Illustrative VM window; desktop decorations may differ" hidden>
  <div class="titlebar"><span>QEMU (Windows CAD)</span><div class="window-tools"><span aria-hidden="true"><svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-minimize"/></svg></span><span aria-hidden="true"><svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-maximize"/></svg></span><button data-screen="" aria-label="Return to library preview"><svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-close"/></svg></button></div></div>
  <div class="vm-menubar" id="vm-controls" hidden><button data-vm-menu="machine" aria-haspopup="menu">Machine</button><button data-vm-menu="view" aria-haspopup="menu">View</button></div>
  <div class="guest-display" aria-label="Sample Windows wallpaper, not a running guest">
    <svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs><linearGradient id="guest-blue" x2="1" y2="1"><stop stop-color="#183b91"/><stop offset="1" stop-color="#498af0"/></linearGradient></defs>
      <rect width="1600" height="900" fill="url(#guest-blue)"/>
      <ellipse cx="550" cy="950" rx="920" ry="650" fill="#3579e6"/>

function showMenu(kind,anchor){

function positionMenu(){
  if(popup.hidden||!menuAnchor)return;

  const viewport=window.visualViewport;
  const left=(viewport?.offsetLeft??0)+8,top=(viewport?.offsetTop??0)+8;
  const width=Math.max(1,(viewport?.width??innerWidth)-16);
  const height=Math.max(1,(viewport?.height??innerHeight)-16);
  popup.style.minWidth=Math.min(260,width)+'px';
  popup.style.maxWidth=width+'px';
  popup.style.maxHeight=height+'px';
  const r=menuAnchor.getBoundingClientRect();

  const below=r.bottom+6,above=r.top-menuHeight-6;
  const y=below+menuHeight<=top+height?below:above>=top?above:top;

  popup.style.top=Math.max(top,Math.min(y,top+height-menuHeight))+'px';

function revealMenuItem(item){

document.addEventListener('click',event=>{
  const target=event.target.closest('button');
  if(!target){if(!popup.contains(event.target))closeMenu();return;}
  if(target.disabled)return;
  if(target.hasAttribute('data-vm-menu')){showMenu('vm-'+target.dataset.vmMenu,target);return;}
  if(target.id==='manage-button'||target.id==='help-button'){const kind=target.id==='manage-button'?'manage':'help';if(menuAnchor===target&&!popup.hidden)closeMenu();else showMenu(kind,target);return;}
  if(target.hasAttribute('data-close')||target.id==='close-dialog'){closeDialog();return;}
  if(target.hasAttribute('data-tab')){showTab(target.dataset.tab);return;}
  if(target.hasAttribute('data-preview')){previewAction(target.dataset.preview);return;}
  if(target.hasAttribute('data-browse')){returnTo=modal.dataset.edit==='true'?'settings':'create';const name=$('vm-name').value;const iso=$('vm-iso').value;const drivers=$('vm-drivers')?.value||'';modal.dataset.savedName=name;modal.dataset.savedIso=iso;modal.dataset.savedDrivers=drivers;modal.dataset.browseField=target.dataset.browse;fileDialog('media');return;}
  if(target.hasAttribute('data-file-cancel')){if(returnTo){const dest=returnTo;returnTo='';restoreMediaForm(dest);}else closeDialog();return;}
  if(target.hasAttribute('data-file-select')){
    const kind=target.dataset.fileSelect;
    if(kind==='media'&&returnTo){const dest=returnTo;returnTo='';const chosen=$('file-name').value;const field=modal.dataset.browseField;restoreMediaForm(dest);$(field==='drivers'?'vm-drivers':'vm-iso').value='/home/demo/Downloads/'+chosen;}
    else if(kind==='gpu-report')openScreen('verification');else if(kind==='export')openScreen('exported');else{closeDialog();previewAction(kind==='import'?'Validating and importing the Windows backup…':'Installation media selected');}return;
  }
  if(target.hasAttribute('data-save')){
    const invalid=!$('vm-name').value.trim()?'Give your Windows environment a name.':target.dataset.save==='create'&&!$('vm-iso').value.trim()?'Choose your Windows installation ISO.':'';
    if(invalid){$('validation-error').textContent=invalid;$('validation-error').hidden=false;showTab('media');return;}
    closeDialog();previewAction('Preview complete');return;
  }
  if(target.hasAttribute('data-remove-confirm')){if($('prompt-input').value!==(isLegacy()?'Windows Legacy':'Windows CAD'))openScreen('name-mismatch');else{closeDialog();previewAction('Remove Windows preview');}return;}
  if(target.hasAttribute('data-finish')){const input=$('prompt-input');if(input&&!input.checkValidity()){input.reportValidity();return;}closeDialog();previewAction('Preview complete');return;}
  if(target.hasAttribute('data-screen')){openScreen(target.dataset.screen);return;}
  if(!popup.contains(target))closeMenu();
});
function restoreMediaForm(dest){const saved={name:modal.dataset.savedName,iso:modal.dataset.savedIso,drivers:modal.dataset.savedDrivers};openScreen(dest);$('vm-name').value=saved.name;$('vm-iso').value=saved.iso;if($('vm-drivers'))$('vm-drivers').value=saved.drivers;}
document.addEventListener('focusin',event=>{if(!popup.hidden&&!popup.contains(event.target)&&event.target!==menuAnchor)closeMenu();});
document.addEventListener('change',event=>{
  if(event.target.id==='workspace-state'){if(modal.open)closeDialog();state=event.target.value;$('screen-picker').value='';renderWorkspace();}
  if(event.target.id==='screen-picker'){returnTo='';openScreen(event.target.value);}
  if(event.target.id==='preset'){
    const values={'Automatic':[8,4,128],'Light':[4,2,64],'Balanced':[8,4,128],'High Performance':[16,8,256],'CAD / Engineering':[16,8,256]}[event.target.value];
    $('automatic-note').hidden=event.target.value!=='Automatic';
    $('advanced-resources').open=event.target.value!=='Automatic';
    $('cad-note').hidden=event.target.value!=='CAD / Engineering';
    if(values)['memory','cpus','disk'].forEach((key,i)=>{if(!$(key).disabled)$(key).value=values[i];});
  }
  if(['memory','cpus','disk'].includes(event.target.id)){$('preset').value='Custom';$('cad-note').hidden=true;$('automatic-note').hidden=true;}
});
document.addEventListener('keydown',event=>{
  if(!$('vm-window').hidden&&!modal.open&&event.ctrlKey&&event.altKey&&event.key.toLowerCase()==='m'){event.preventDefault();closeMenu();$('vm-controls').hidden=!$('vm-controls').hidden;return;}
  if(event.key==='Escape'&&!popup.hidden){event.preventDefault();const anchor=menuAnchor;closeMenu();if(anchor)anchor.focus();}
  else if(!popup.hidden&&['ArrowDown','ArrowUp','Home','End','PageDown','PageUp'].includes(event.key)){
    event.preventDefault();const items=[...popup.querySelectorAll('button:not(:disabled)')];if(!items.length)return;
    let i=items.indexOf(document.activeElement);
    const page=Math.max(1,Math.floor(popup.clientHeight/items[0].offsetHeight)-1);
    if(event.key==='Home')i=0;
    else if(event.key==='End')i=items.length-1;
    else if(event.key==='PageDown'||event.key==='PageUp')i=Math.max(0,Math.min(items.length-1,i+(event.key==='PageDown'?page:-page)));
    else i=(i+(event.key==='ArrowDown'?1:-1)+items.length)%items.length;
    focusMenuItem(items[i]);
  }
  if(event.target.matches('[role=tab]')&&['ArrowRight','ArrowLeft'].includes(event.key)){event.preventDefault();const tabs=[...modal.querySelectorAll('[role=tab]')];const i=(tabs.indexOf(event.target)+(event.key==='ArrowRight'?1:2))%3;showTab(tabs[i].dataset.tab);tabs[i].focus();}
});
modal.addEventListener('close',()=>{$('screen-picker').value='';returnTo='';});
window.addEventListener('resize',positionMenu);
window.addEventListener('scroll',positionMenu);
$('cards').addEventListener('scroll',positionMenu);
window.visualViewport?.addEventListener('resize',positionMenu);
window.visualViewport?.addEventListener('scroll',positionMenu);
const frameObserver=new ResizeObserver(positionMenu);
document.querySelectorAll('.shell').forEach(frame=>frameObserver.observe(frame));
renderWorkspace();
</script>
</body>
</html>
