name: Build Debian package

on:
  push:
    paths:
      - ".github/workflows/build-deb.yml"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY.md"
      - "src/**"
      - "docs/**"
      - "guest/**"
      - "resources/**"
      - "packaging/linux/**"
      - "tools/build_deb.py"
  pull_request:
    paths:
      - ".github/workflows/build-deb.yml"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY.md"
      - "src/**"
      - "docs/**"
      - "guest/**"
      - "resources/**"
      - "packaging/linux/**"
      - "tools/build_deb.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-deb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Build amd64 DEB on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package builder
        run: python -m pip install --upgrade pip build

      - name: Build Debian package
        run: python tools/build_deb.py

      - name: Inspect Debian package
        run: |
          dpkg-deb --info dist/virtue-desktop_0.1.0_amd64.deb
          dpkg-deb --contents dist/virtue-desktop_0.1.0_amd64.deb
          sha256sum --check dist/virtue-desktop_0.1.0_amd64.deb.sha256

      - name: Upload Debian package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: virtue-desktop-deb-ubuntu-24.04-amd64
          path: |
            dist/virtue-desktop_0.1.0_amd64.deb
            dist/virtue-desktop_0.1.0_amd64.deb.sha256
          if-no-files-found: error
          retention-days: 14
