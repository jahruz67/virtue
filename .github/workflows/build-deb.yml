name: Build Debian package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-deb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Build amd64 DEB on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package builder
        run: python -m pip install --upgrade pip build

      - name: Build Debian package
        run: python tools/build_deb.py

      - name: Inspect Debian package
        working-directory: dist
        run: |
          dpkg-deb --info ./*.deb
          dpkg-deb --contents ./*.deb
          sha256sum --check ./*.deb.sha256

      - name: Install and open packaged UI offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb
          /usr/bin/virtue --version
          (cd / && md5sum --check /var/lib/dpkg/info/virtue-desktop.md5sums)
          QT_QPA_PLATFORM=offscreen /usr/bin/python3 -I - <<'PY'
          import ctypes
          import sys
          sys.path.insert(0, "/opt/virtue/lib")
          from PySide6.QtWidgets import QApplication
          from virtue.ui import MainWindow
          ctypes.CDLL("/opt/virtue/lib/PySide6/Qt/plugins/platforms/libqxcb.so")
          app = QApplication([])
          window = MainWindow(None, auto_refresh=False)
          window.show()
          app.processEvents()
          window.close()
          PY

      - name: Upload Debian package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: virtue-desktop-deb-ubuntu-24.04-amd64
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
          retention-days: 14
