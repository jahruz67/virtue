name: Build and release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m virtue --diagnose
      - name: Build Python distribution
        run: python -m build
      - name: Build DEB
        run: python tools/build_deb.py
      - name: Install and open packaged UI offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb
          /usr/bin/virtue --version
          (cd / && md5sum --check /var/lib/dpkg/info/virtue-desktop.md5sums)
          QT_QPA_PLATFORM=offscreen /usr/bin/python3 -I - <<'PY'
          import ctypes
          import sys
          sys.path.insert(0, "/opt/virtue/lib")
          from PySide6.QtWidgets import QApplication
          from virtue.ui import MainWindow
          ctypes.CDLL("/opt/virtue/lib/PySide6/Qt/plugins/platforms/libqxcb.so")
          app = QApplication([])
          window = MainWindow(None, auto_refresh=False)
          window.show()
          app.processEvents()
          window.close()
          PY
      - name: Install RPM builder
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build Fedora RPM
        run: python tools/build_rpm.py
      - name: Inspect Fedora RPM
        working-directory: dist
        run: |
          rpm -qpi ./*.rpm
          rpm -qpl ./*.rpm
          rpm -qp --requires ./*.rpm
          sha256sum --check ./*.rpm.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: virtue-Linux
          path: dist/

  build-macos:
    name: Build Mac application
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/build-macos.yml

  release:
    name: Publish release packages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Download Linux release packages
        uses: actions/download-artifact@v4
        with:
          name: virtue-Linux
          path: dist

      - name: Download Mac release packages
        uses: actions/download-artifact@v4
        with:
          name: virtue-macos-arm64
          path: dist/macos

      - name: Publish packages to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="build-$GITHUB_SHA"
          fi
          assets=(dist/*.whl dist/*.tar.gz dist/*.deb dist/*.deb.sha256 dist/*.rpm dist/*.rpm.sha256
            dist/macos/Virtue-macos-arm64.zip dist/macos/Virtue-macos-arm64.zip.sha256
            dist/macos/Virtue-macos-runtime-sources.tar.gz dist/macos/Virtue-macos-runtime-sources.tar.gz.sha256)
          for asset in "${assets[@]}"; do
            test -f "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          (cd dist && sha256sum --check ./*.deb.sha256 ./*.rpm.sha256)
          (cd dist/macos && sha256sum --check ./*.sha256)
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes \
              --title "Virtue $RELEASE_TAG" --prerelease --draft "${assets[@]}"
          else
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          fi
          gh release edit "$RELEASE_TAG" --draft=false

